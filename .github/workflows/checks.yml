name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.428'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and run offline checks
        shell: pwsh
        run: ./tools/Check.ps1
