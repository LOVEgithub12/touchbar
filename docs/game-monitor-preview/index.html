  (() =&gt; {
    const root = document.getElementById(&#x27;tb-readme-game-preview&#x27;);
    const assets = JSON.parse(root.querySelector(&#x27;#tb-readme-game-assets&#x27;).textContent);
    const picker = root.querySelector(&#x27;select&#x27;);
    const canvas = root.querySelector(&#x27;canvas&#x27;);
    const context = canvas.getContext(&#x27;2d&#x27;);
    const status = root.querySelector(&#x27;.accessible-status&#x27;);
    const images = {};
    const keys = Object.keys(assets).filter(key =&gt; key !== &#x27;volume&#x27;);
    let game = &#x27;lol&#x27;;

    picker.replaceChildren(...keys.map(key =&gt; {
      const option = document.createElement(&#x27;option&#x27;);
      option.value = key;
      option.textContent = assets[key].name;
      return option;
    }));

    function label(text, x, y, size = 28, color = &#x27;#f4f4f6&#x27;) {
      context.font = `500 ${size}px &quot;Segoe UI&quot;,&quot;Microsoft YaHei&quot;,sans-serif`;
      context.textAlign = &#x27;left&#x27;;
      context.textBaseline = &#x27;top&#x27;;
      context.fillStyle = color;
      context.fillText(text, x, y);
    }

    function render() {
      picker.value = game;
      context.fillStyle = &#x27;#000&#x27;;
      context.fillRect(0, 0, 2008, 60);
      const icon = images[game];
      if (icon?.complete &amp;&amp; icon.naturalWidth) context.drawImage(icon, 34, 6, 48, 48);
      context.fillStyle = &#x27;#303034&#x27;;
      [116, 690, 1030, 1588].forEach(x =&gt; context.fillRect(x, 11, 1, 38));
      label(&#x27;CPU&#x27;, 140, 16, 28, &#x27;#b5bbc5&#x27;);
      label(&#x27;70.1°C&#x27;, 222, 14, 30);
      label(&#x27;17%&#x27;, 353, 16);
      label(&#x27;3.80 GHz&#x27;, 438, 16);
      label(&#x27;120&#x27;, 712, 10, 37, &#x27;#8be6a8&#x27;);
      label(&#x27;FPS&#x27;, 788, 17, 26);
      label(&#x27;8.3 ms&#x27;, 870, 17, 26, &#x27;#b9bfc8&#x27;);
      label(&#x27;GPU&#x27;, 1050, 16, 28, &#x27;#b5bbc5&#x27;);
      label(&#x27;73.0°C&#x27;, 1136, 14, 30);
      label(&#x27;16%&#x27;, 1267, 16);
      label(&#x27;1600 MHz&#x27;, 1355, 16);
      if (images.volume?.complete &amp;&amp; images.volume.naturalWidth) {
        context.drawImage(images.volume, 1588, 0, 420, 60);
      }
      canvas.setAttribute(&#x27;aria-label&#x27;, `${assets[game].name}游戏监控栏，示例数据：CPU 70.1°C、17%、3.80 GHz；120 FPS、8.3 ms；GPU 73.0°C、16%、1600 MHz；静音、音量减、音量加。`);
    }

    function restore(snapshot) {
      const savedGame = snapshot?.modelContent?.game ?? snapshot?.privateContent?.game;
      if (keys.includes(savedGame)) game = savedGame;
    }

    restore(window.openai?.widgetState);
    Object.entries(assets).forEach(([key, value]) =&gt; {
      const img = new Image();
      images[key] = img;
      img.onload = render;
      img.src = key === &#x27;volume&#x27; ? value : value.icon;
    });
    picker.addEventListener(&#x27;change&#x27;, () =&gt; {
      if (!keys.includes(picker.value)) return;
      game = picker.value;
      render();
      status.textContent = `已切换为${assets[game].name}图标`;
      if (window.openai?.setWidgetState) {
        window.openai.setWidgetState({modelContent: {game, gameName: assets[game].name, layout: &#x27;单行直读&#x27;}, privateContent: null}).catch(() =&gt; {});
      }
    });
    window.addEventListener(&#x27;openai:set_globals&#x27;, event =&gt; {
      const snapshot = event.detail?.globals?.widgetState;
      if (snapshot) { restore(snapshot); render(); }
    });
    render();
  })();
